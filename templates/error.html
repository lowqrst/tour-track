<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Status}} — {{.Title}}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .error-box {
        max-width: 600px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
      }
      .error-box h1 { font-size: 3rem; margin-bottom: 8px; }
      .error-box p { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div class="error-box">
      <p style="color:#7dd3fc; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;">Tour Track</p>
      <h1>{{.Status}}</h1>
      <h2>{{.Title}}</h2>
      <p>{{.Message}}</p>
      <a href="/" style="display:inline-block; margin-top: 18px; color: white; text-decoration:none; background: linear-gradient(135deg, #38bdf8, #2563eb); padding: 10px 16px; border-radius: 999px; font-weight: 700;">Return to dashboard</a>
    </div>
  </body>
</html>
