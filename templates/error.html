<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Status}} — {{.Title}} | Tour Track</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    {{template "header"}}
    <main id="main" class="error-page shell">
      <div class="error-record" aria-hidden="true">
        <span>{{.Status}}</span>
      </div>
      <div class="error-copy">
        <p class="eyebrow">A break in the rhythm / {{.Status}}</p>
        <h1>{{.Title}}<span class="accent-period">.</span></h1>
        <p>{{.Message}}</p>
        <a class="button button-dark" href="/">Back to the collection <span aria-hidden="true">↗</span></a>
      </div>
    </main>
    {{template "footer"}}
  </body>
</html>
